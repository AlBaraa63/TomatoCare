# TomatoCare — Authoritative Machine Learning Configurations
# This single file serves as the source of truth for all training,
# calibration, evaluation, and export hyperparameters.

# --- Seeding and Reproducibility ---
seed: 42

# --- Image Parameters ---
img_size: 224
batch_size: 32

# --- Stage 1 Training: Classification Head only (backbone frozen) ---
stage1_epochs: 30
stage1_lr: 0.001
stage1_patience: 5

# --- Stage 2 Training: Backbone Fine-Tuning ---
stage2_epochs: 10
stage2_lr: 0.0001
stage2_patience: 3            # fine-tuning overfits fast, use tighter patience
fine_tune_from_layer: -30     # unfreeze the top 30 layers of MobileNetV3-Large

# --- Model Architecture ---
dropout_rate: 0.4

# --- Training Loss ---
# label_smoothing > 0 improves softmax calibration on device alerts.
loss:
  label_smoothing: 0.05

# --- Training Class Weights ---
# Prevents larger OOD classes from biasing the classification decisions.
class_weights:
  mode: balanced              # balanced | none | manual

# --- Quality Assurance Verification Gates ---
confidence_threshold: 0.60
target_accuracy: 0.90
notaleaf_min_recall: 0.80      # leaf gate must catch >=80% of negatives
max_false_reject_rate: 0.15    # do not reject more than 15% of real leaves
tflite_max_size_mb: 15
apk_max_size_mb: 50

# --- Canonical Model Classes ---
# List order dictates index matching on the Android client.
# Index 10 is the out-of-distribution (OOD) reject class.
classes:
  - Tomato_Bacterial_spot
  - Tomato_Early_blight
  - Tomato_healthy
  - Tomato_Late_blight
  - Tomato_Leaf_Mold
  - Tomato_Septoria_leaf_spot
  - Tomato_Spider_mites_Two_spotted_spider_mite
  - Tomato_Target_Spot
  - Tomato_Yellow_Leaf_Curl_Virus
  - Tomato_mosaic_virus
  - Tomato_NotALeaf

# --- OOD reject class configuration ---
ood:
  class_name: Tomato_NotALeaf

# --- Temperature Calibration Settings ---
# Temperature scaling scales raw logits by a factor T to fix model overconfidence.
calibration:
  enabled: true
  optimizer: lbfgs
  max_iter: 50

# --- Workspace Paths ---
paths:
  splits_dir: dataset/splits
  augmented_dir: dataset/augmented
  results_dir: results
  checkpoints_dir: models/checkpoints
  tflite_dir: models/tflite

# --- Shipped Model Version ---
model_version: "2.0.0"
