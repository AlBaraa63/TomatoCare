org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Pin the Gradle daemon JVM to the Android Studio bundled JBR (JDK 21).
# Without this, a host with JDK 22+ as the default JAVA_HOME makes Gradle
# 8.7's Kotlin DSL bail with a cryptic numeric error (the version number
# of the unsupported JDK). The Android Studio JBR is installed at this
# canonical path for every team member who has Android Studio installed.
# Override locally if your IDE installs to a non-default location.
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
