services:

  # ── ML pipeline — CPU ────────────────────────────────────────────────────────
  # Run a single script:
  #   docker compose run --rm ml python -m ml.scripts.eval_model
  #   docker compose run --rm ml python -m ml.scripts.train_stage1
  #
  # Before training, edit ml/configs/training_config.yaml and set:
  #   pre_split_root: /app/ml/dataset/processed
  # Then mount your dataset directory below instead of ./ml/dataset/processed.
  ml:
    build:
      context: .
      dockerfile: Dockerfile.ml
    volumes:
      - ./ml/dataset:/app/ml/dataset
      - ./ml/models:/app/ml/models
      - ./ml/results:/app/ml/results
      - ./ml/configs:/app/ml/configs     # mount config so edits take effect immediately
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2

  # ── ML pipeline — GPU ────────────────────────────────────────────────────────
  # Requires: NVIDIA GPU + nvidia-container-toolkit installed on the host.
  # Install toolkit: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
  #
  # Usage:
  #   docker compose --profile gpu run --rm ml-gpu python -m ml.scripts.train_stage1
  ml-gpu:
    build:
      context: .
      dockerfile: Dockerfile.ml
      args:
        BASE_IMAGE: tensorflow/tensorflow:2.15.0-gpu
    volumes:
      - ./ml/dataset:/app/ml/dataset
      - ./ml/models:/app/ml/models
      - ./ml/results:/app/ml/results
      - ./ml/configs:/app/ml/configs
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: [gpu]

  # ── Android build ─────────────────────────────────────────────────────────────
  # Builds a debug APK. Output lands in android/app/build/outputs/apk/debug/.
  #
  # Usage:
  #   docker compose --profile android run --rm android-build
  #
  # For a release APK, override the command:
  #   docker compose --profile android run --rm android-build \
  #     bash -c "cd android && ./gradlew :app:assembleRelease --no-daemon"
  android-build:
    build:
      context: .
      dockerfile: Dockerfile.android
    volumes:
      - ./android/app/build/outputs:/app/android/app/build/outputs
      - gradle-cache:/root/.gradle
    profiles: [android]

volumes:
  gradle-cache:    # persists downloaded Gradle dependencies across rebuilds
