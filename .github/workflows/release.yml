name: Release

# On a version tag (e.g. v2.0.0) this builds the debug APK and opens a DRAFT
# GitHub Release with it attached. The release is left as a draft on purpose:
# the three TFLite models are intentionally not committed (see .gitignore), so a
# maintainer must attach them to the draft before publishing — without them the
# APK installs but cannot diagnose. The draft body lists exactly what to attach.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write   # required to create the release

jobs:
  release:
    name: Build APK & open draft release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Open draft release with APK
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: TomatoCare ${{ github.ref_name }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## TomatoCare ${{ github.ref_name }}

            Fully offline, bilingual (EN/AR) tomato leaf-disease diagnosis on Android.

            ### ⚠️ Before publishing this release — attach the 3 TFLite models
            The APK below installs but **cannot diagnose** until the cascade models
            are present. Attach these files to this release (they are not committed
            to git — see `.gitignore`):
            - `stage1_leaf_float16.tflite` (1.92 MB — leaf gate)
            - `stage2_tomato_float16.tflite` (1.92 MB — tomato gate)
            - `stage3_disease_float16.tflite` (6.03 MB — 11-class classifier)

            Contributors then drop the three files into
            `android/app/src/main/assets/` (see `CONTRIBUTING.md`).

            ### Included
            - `app-debug.apk` — installable debug build
